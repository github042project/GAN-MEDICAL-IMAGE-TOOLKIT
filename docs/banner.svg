<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DD6F5"/>
      <stop offset="0.55" stop-color="#C6F36B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DD6F5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3DD6F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glowC)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="330" r="220" fill="url(#glowO)">
    <animate attributeName="r" values="200;240;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- stylised lungs -->
  <g transform="translate(985 180)" fill="none" stroke-linecap="round">
    <path d="M-8 -95 V-30 M-8 -30 C-30 -20 -45 -5 -55 10 M-8 -30 C14 -20 29 -5 39 10" stroke="#E8E4DA" stroke-opacity="0.5" stroke-width="4" transform="translate(8 0)"/>
    <path d="M-20 -60 C-75 -70 -120 -10 -118 55 C-116 100 -80 115 -45 98 C-25 88 -20 60 -20 30 Z" stroke="#3DD6F5" stroke-width="3" fill="#3DD6F5" fill-opacity="0.08">
      <animate attributeName="fill-opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M20 -60 C75 -70 120 -10 118 55 C116 100 80 115 45 98 C25 88 20 60 20 30 Z" stroke="#3DD6F5" stroke-width="3" fill="#3DD6F5" fill-opacity="0.08">
      <animate attributeName="fill-opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite"/>
    </path>
    <g stroke="#C6F36B" stroke-opacity="0.55" stroke-width="2">
      <path d="M-50 10 L-80 40 M-60 20 L-65 70 M-80 40 L-100 55"/>
      <path d="M50 10 L80 40 M60 20 L65 70 M80 40 L100 55"/>
    </g>
    <circle r="150" stroke="#3DD6F5" stroke-opacity="0.18" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <line x1="-150" x2="150" stroke="#C6F36B" stroke-opacity="0.6" stroke-width="2">
      <animate attributeName="y1" values="-120;120;-120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-120;120;-120" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="96" fill="#9AA3B2" font-size="18" letter-spacing="4">GENERATOR  ⟷  DISCRIMINATOR</text>
    <text x="68" y="170" fill="url(#title)" font-size="62" font-weight="800">GAN Medical</text>
    <text x="68" y="238" fill="#E8E4DA" font-size="62" font-weight="800">Imaging Toolkit</text>
    <text x="70" y="290" fill="#9AA3B2" font-size="21">Augment · Clean · Balance · Generate · right in your browser</text>
  </g>
  <rect x="70" y="312" width="120" height="4" rx="2" fill="url(#title)">
    <animate attributeName="width" values="60;220;60" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
